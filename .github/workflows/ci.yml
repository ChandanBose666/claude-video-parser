name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install ffmpeg + tesseract (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: Install test deps
        run: python -m pip install --upgrade pip pillow

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Cursor-detection unit tests
        run: python tests/test_cursor_units.py

      - name: OCR unit tests
        run: python tests/test_ocr_units.py

      - name: ROI and artifact-detection unit tests
        run: python tests/test_misc_units.py

      - name: End-to-end extractor test
        run: python tests/test_extract.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check --select=E9,F63,F7,F82,F401 .
      - name: Every skill has YAML frontmatter with name + description
        run: |
          fail=0
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -q -- '---' || { echo "$f: missing frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "$f: missing name"; fail=1; }
            grep -q '^description:' "$f" || { echo "$f: missing description"; fail=1; }
          done
          exit $fail
